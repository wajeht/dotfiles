set -g default-terminal "tmux-256color"
# Ghostty's TERM is xterm-ghostty: declare truecolor (RGB), colored undercurls
# (usstyle — nvim LSP diagnostics), and OSC 8 hyperlinks so tmux passes them
# through. The xterm-256color line stays for SSH-back and older clients.
set -as terminal-features ',xterm-ghostty:RGB:usstyle:hyperlinks'
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

# Ctrl+Tab / Ctrl+Shift+Tab cycle windows like browser tabs. A terminal can't
# encode Ctrl+Tab on its own (Ctrl+I == Tab), so Ghostty emits a standard CSI-u
# sequence (see ghostty/config); extended-keys on lets tmux decode it into the
# C-Tab / C-BTab key names bound below. NOTE: the S-Enter binding below
# depends on this option too — don't remove it with the Ctrl+Tab block.
set -s extended-keys on
bind -n C-Tab next-window
# Shift+Tab collapses to "BTab" in tmux, so Ctrl+Shift+Tab arrives as C-BTab.
bind -n C-BTab previous-window

# Shift+Enter (Ghostty sends CSI-u 13;2u, decoded as S-Enter — requires
# the extended-keys above). nvim and ssh panes get the original CSI-u
# bytes: nvim decodes <S-CR> itself (a re-emitted 0x0a would hit its
# <C-j> navigator mapping and switch panes), and an ssh pane hands the
# discrete key to the remote host's own tmux/zsh bindings (this same
# config deployed there would steal a raw 0x0a as C-j again). Every
# other pane gets the newline byte 0x0a — insert-newline in Claude
# Code, plain Enter at a shell — matching what shift+enter=text:\n
# always delivered. It can't stay a plain \n from Ghostty: that byte is
# Ctrl+J, which the C-j pane-navigation binding below turns into
# select-pane -D in non-vim panes. Leaving S-Enter unbound is also not
# an option: tmux 3.7 has no kitty-protocol passthrough and degrades an
# unbound S-Enter to plain Enter — submit instead of newline.
bind -n S-Enter if -F "#{m/r:^(g?(view|n?vim)(diff)?|ssh)$,#{pane_current_command}}" "send-keys -H 1b 5b 31 33 3b 32 75" "send-keys -H 0a"

# Cmd+W (Ghostty sends it as M-w) closes the current window, like a browser tab.
# Confirm first so a stray press can't nuke a window with work running in it.
bind -n M-w confirm-before -p "kill window #W? (y/n)" kill-window

# Cmd+T (M-t) opens a new window in the current session, in the current pane's
# directory (so a new tab stays in the project, not $HOME).
bind -n M-t new-window -c "#{pane_current_path}"

# vim-tmux-navigator: C-h/j/k/l move seamlessly between nvim splits and tmux
# panes. If the focused pane is running (n)vim/fzf, pass the key through so nvim
# handles it; otherwise switch tmux pane. (nvim side: plugins/tmux-navigator.lua.)
# C-l is special: navigating "right" collides with the shell's Ctrl-L clear. When
# the pane is at the right edge (#{pane_at_right}) C-l passes through to clear;
# otherwise it moves right. So Ctrl-L / Cmd+K clear whenever the pane is at the
# right edge — always, in a single-pane window; in a split, only from the
# rightmost pane (a left/middle pane's C-l moves right instead).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'if -F "#{pane_at_right}" "send-keys C-l" "select-pane -R"'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

set -g mouse on

set -g status-position top

# Update the outer terminal title (Ghostty's window title) from tmux.
# Follows tmux's own default pattern (#S:#I:#W - "#T"), minus the noise: #T is
# the pane title the running program publishes via OSC — zsh sets the cwd,
# nvim the open file, agents their status, and an SSH'd remote shell its own
# user@host — so the title stays plain text and self-describing. The
# #{user}@#h prefix identifies the local user/machine at a glance; an SSH'd
# pane additionally shows the remote user@host via #T.
# The s|| strips leading spinner glyphs (⠂ ✳ …) that agent panes prepend.
# Pipe delimiter and literal A-Za-z0-9 ranges are required: an unescaped / or
# the : in [[:alnum:]] both collide with tmux format syntax.
set -g set-titles on
set -g set-titles-string '#{user}@#h · #S:#W — #{s|^[^A-Za-z0-9~/]+||:pane_title}'

# Palette mirrored from the nvim vscode theme (lua/colors/init.lua);
# names match the lua table keys. %hidden expands ${c_*} at config parse
# time inside the double-quoted styles/formats below, without leaking
# into pane environments — each color lives here exactly once.
%hidden c_fg="#D4D4D4"
%hidden c_gray="#808080"
%hidden c_line_nr="#5A5A5A"
%hidden c_dim="#444444"
%hidden c_yellow="#DCDCAA"
%hidden c_blue="#569CD6"
%hidden c_selection="#264F78"
%hidden c_list_sel_bg="#03395e"

# Transparent status bar that blends into the terminal background
# (solid default green paints an ugly slab into Ghostty's rounded corners).
set -g status-style "bg=default,fg=${c_gray}"
# status-format with two aligned zones. align=left/right place each:
#   left   windows  — #{W:...} loops all windows; active one gets the blue
#                     highlight, others the quiet gray (same palette as before)
#   right  file path (nvim panes only), then session on git — nvim publishes the
#                     open file's cwd-relative path as the pane title, so we show
#                     it only when the pane runs nvim (in a shell it's just the
#                     cwd, redundant with the session name). Then cyan session
#                     name, white 'on', green branch and change counts from
#                     status-path.sh (mirrors the zsh prompt). No user@host
#                     here: the window title and the prompt's %n@%m already
#                     carry it
set -g status-format[0] "#[align=left]#{W:#[range=window|#{window_index}]#{?window_active,#[fg=${c_fg} bg=${c_list_sel_bg} bold],#[fg=${c_line_nr}]} #I:#W #[norange default]}#[align=right]#{?client_prefix,#[fg=${c_yellow} bold]^A ,}#{?#{==:#{pane_current_command},nvim},#[fg=${c_gray}]#{pane_title} ,}#[fg=cyan]#{session_name}#(/bin/sh ~/.config/tmux/status-path.sh \"#{pane_current_path}\") #(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
set -g status-interval 5 # Refresh branch name every 5s

# Pane borders and copy-mode selection in the same palette
set -g pane-border-style "fg=${c_dim}"
set -g pane-active-border-style "fg=${c_dim}"
set -g mode-style "bg=${c_selection}"
set -g message-style "bg=default,fg=${c_yellow}"

# Session/window tree (prefix+s / prefix+w) in the nvim vscode palette
# (lua/colors/init.lua): blue sessions like Directory, gray metadata
# (line_nr), fg window names, yellow flags. The selected-row bar comes from
# mode-style above. Styles use spaces not commas (#[fg=x bold]) — a comma
# inside #[] breaks the surrounding #{?,,} conditional.
%hidden tree_format="#{?pane_format,#[fg=${c_gray}]#{pane_index}: #{pane_current_command}#[fg=${c_yellow}]#{?pane_active, *,}#{?pane_marked, M,},#{?window_format,#[fg=${c_line_nr}]#{window_index}: #[fg=${c_fg}]#{window_name}#[fg=${c_yellow}]#{window_flags},#[fg=${c_blue} bold]#{session_name} #[fg=${c_line_nr}]#{session_windows} windows#{?session_attached, (attached),}}}"
bind s choose-tree -Zs -F "$tree_format"
bind w choose-tree -Zw -F "$tree_format"
# The tree's outer box lines are hardcoded to the terminal default fg
# (mode-tree.c draws them with no style option) and can't be themed. The
# pane-indicator chips in the preview can: the default
# tree-mode-preview-style reads its colors from the two display-panes
# options, so setting those (gray inactive, yellow active — instead of
# the default blue/red) themes both the tree preview chips and the
# prefix+q overlay, and works on older tmux without the 3.7-only option.
set -g display-panes-colour "${c_line_nr}"
set -g display-panes-active-colour "${c_yellow}"

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # 'v' to begin selection
# C-v: block selection like vim. With a selection active it converts it
# in place (vim's v -> C-v idiom); bare C-v starts a fresh block selection
# (plain begin+toggle would re-anchor an existing selection at the cursor).
bind-key -T copy-mode-vi 'C-v' if -F "#{selection_present}" { send -X rectangle-toggle } { send -X begin-selection ; send -X rectangle-toggle }
bind-key -T copy-mode-vi 'y' send -X copy-selection # 'y' to copy

# Releasing a mouse drag copies the selection to the system clipboard
# (OSC 52, like 'y') without clearing it or leaving copy mode — the
# tmux-side mirror of Ghostty's copy-on-select.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# Cmd+C (Ghostty sends CSI-u super+c, which tmux decodes as M-c — see
# ghostty/config) copies the copy-mode selection. Outside copy mode,
# forward the original CSI-u bytes (hex: ESC [ 9 9 ; 9 u) to (n)vim and
# ssh panes — local nvim decodes them as <D-c> (keymaps.lua), a remote
# host over ssh gets the same discrete sequence for its own nvim/zsh
# bindings — and swallow the key everywhere else: re-emitting it as
# Esc-c in a TUI like an agent pane would read as an interrupt. The
# format match replaces the ps-forking $is_vim here: Cmd+C is frequent
# and if-shell blocks the server for the fork round-trip on every press.
bind -T copy-mode-vi M-c send -X copy-selection-no-clear
bind -n M-c if -F "#{m/r:^(g?(view|n?vim)(diff)?|ssh)$,#{pane_current_command}}" "send-keys -H 1b 5b 39 39 3b 39 75"

set -sg escape-time 10 # Remove esc delay in Neovim

# Forward terminal focus in/out to programs: nvim's FocusGained/FocusLost
# drive autoread and gitsigns refresh when you switch panes/apps.
set -g focus-events on
# Default 2000 lines of scrollback evaporates fast; 50k is still cheap.
set -g history-limit 50000
# Let image protocols (kitty graphics/sixel) tunnel through tmux to Ghostty.
set -g allow-passthrough on
# Let programs inside panes set the clipboard via OSC 52 (remote nvim's SSH
# clipboard provider depends on this) — 'external' silently drops their writes.
set -g set-clipboard on
# Keep window indexes gapless when a window closes (matches ctrl+tab order
# and the status-bar list).
set -g renumber-windows on
# Killing a session's last window hops to another session instead of
# detaching to a bare shell — fits the multi-session sessionizer workflow.
set -g detach-on-destroy off

# Ctrl+F opens the project sessionizer from any pane (even inside nvim);
# the zsh dev-widget only handles Ctrl+F outside tmux.
# -B: no tmux border — fzf fills the popup and draws the only border,
# in the FZF_DEFAULT_OPTS theme (DEV_POPUP tells dev() to skip --height)
# Lean shell (~7ms) instead of full interactive startup (~340ms): source only
# env.zsh (PATH, FZF theme) and functions.zsh (dev)
bind -n C-f display-popup -B -E -w 60% -h 50% "DEV_POPUP=1 zsh -c 'source ~/.config/zsh/env.zsh; source ~/.config/zsh/functions.zsh; dev'"

# Persist tmux sessions across restarts with tmux-resurrect and tmux-continuum.
# Manual save/restore: prefix + Ctrl-s / prefix + Ctrl-r.
# Continuum autosaves every 5 minutes and restores when the tmux server starts.
# NOTE: continuum triggers saves via a hook it injects into status-right, but
# the custom status-format above replaces the whole status line and never
# renders status-right — so the same continuum_save.sh is embedded directly in
# status-format (invisible; runs every status-interval, saves per the interval
# below). Without that embed, autosave silently never fires.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
# Resurrect restores sessions/panes but NOT @-prefixed user options, so every
# restored session loses the @dev_path stamp dev() sets — the sessionizer then
# re-lists each project folder and spawns a duplicate session when you pick one.
# This post-restore hook re-stamps @dev_path on a restored session when a pane
# sits in a real project dir AND the session's name is the one dev() derives for
# it (invoked via /bin/sh like status-path.sh, not the exec bit).
set -g @resurrect-hook-post-restore-all '/bin/sh ~/.config/tmux/restore-dev-path.sh'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'
