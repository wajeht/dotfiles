set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set -g status-position bottom

# Transparent status bar that blends into the terminal background
# (solid default green paints an ugly slab into Ghostty's rounded corners).
# Colors from the nvim vscode theme (lua/colors/init.lua)
set -g status-style "bg=default,fg=#808080"
set -g status-left ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#D4D4D4,bg=#03395e,bold] #I:#W "
set -g status-right "#[fg=#808080]\"#{=21:pane_title}\" #[fg=#569CD6,bold][#S] #[fg=#5A5A5A]%H:%M %d-%b-%y"
set -g status-right-length 60

# Pane borders and copy-mode selection in the same palette
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#569CD6"
set -g mode-style "bg=#264F78"
set -g message-style "bg=default,fg=#DCDCAA"

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # 'v' to begin selection
bind-key -T copy-mode-vi 'y' send -X copy-selection # 'y' to copy

unbind -T copy-mode-vi MouseDragEnd1Pane # Don't exit copy mode with mouse drag

set -sg escape-time 10 # Remove esc delay in Neovim

# Ctrl+F opens the project sessionizer from any pane (even inside nvim);
# the zsh dev-widget only handles Ctrl+F outside tmux.
# -B: no tmux border — fzf fills the popup and draws the only border,
# in the FZF_DEFAULT_OPTS theme (DEV_POPUP tells dev() to skip --height)
bind -n C-f display-popup -B -E -w 60% -h 50% "DEV_POPUP=1 zsh -ic dev"
