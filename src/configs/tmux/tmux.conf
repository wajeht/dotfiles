set -g default-terminal "tmux-256color"
# Ghostty's TERM is xterm-ghostty: declare truecolor (RGB), colored undercurls
# (usstyle — nvim LSP diagnostics), and OSC 8 hyperlinks so tmux passes them
# through. The xterm-256color line stays for SSH-back and older clients.
set -as terminal-features ',xterm-ghostty:RGB:usstyle:hyperlinks'
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

# Ctrl+Tab / Ctrl+Shift+Tab cycle windows like browser tabs. A terminal can't
# encode Ctrl+Tab on its own (Ctrl+I == Tab), so Ghostty emits a standard CSI-u
# sequence (see ghostty/config); extended-keys on lets tmux decode it into the
# C-Tab / C-BTab key names bound below.
set -s extended-keys on
bind -n C-Tab next-window
# Shift+Tab collapses to "BTab" in tmux, so Ctrl+Shift+Tab arrives as C-BTab.
bind -n C-BTab previous-window

# Cmd+W (Ghostty sends it as M-w) closes the current window, like a browser tab.
# Confirm first so a stray press can't nuke a window with work running in it.
bind -n M-w confirm-before -p "kill window #W? (y/n)" kill-window

# Cmd+T (M-t) opens a new window in the current session, in the current pane's
# directory (so a new tab stays in the project, not $HOME).
bind -n M-t new-window -c "#{pane_current_path}"

# vim-tmux-navigator: C-h/j/k/l move seamlessly between nvim splits and tmux
# panes. If the focused pane is running (n)vim/fzf, pass the key through so nvim
# handles it; otherwise switch tmux pane. (nvim side: plugins/tmux-navigator.lua.)
# C-l is special: navigating "right" collides with the shell's Ctrl-L clear. When
# the pane is at the right edge (#{pane_at_right}) C-l passes through to clear;
# otherwise it moves right. So Ctrl-L / Cmd+K clear whenever the pane is at the
# right edge — always, in a single-pane window; in a split, only from the
# rightmost pane (a left/middle pane's C-l moves right instead).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'if -F "#{pane_at_right}" "send-keys C-l" "select-pane -R"'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

set -g mouse on

set -g status-position top

# Update the outer terminal title (Ghostty's window title) from tmux.
# Follows tmux's own default pattern (#S:#I:#W - "#T"), minus the noise: #T is
# the pane title the running program publishes via OSC — zsh sets the cwd,
# nvim the open file, agents their status, and an SSH'd remote shell its own
# user@host — so the title stays plain text and self-describing. The
# #{user}@#h prefix identifies the local user/machine at a glance; an SSH'd
# pane additionally shows the remote user@host via #T.
# The s|| strips leading spinner glyphs (⠂ ✳ …) that agent panes prepend.
# Pipe delimiter and literal A-Za-z0-9 ranges are required: an unescaped / or
# the : in [[:alnum:]] both collide with tmux format syntax.
set -g set-titles on
set -g set-titles-string '#{user}@#h · #S:#W — #{s|^[^A-Za-z0-9~/]+||:pane_title}'

# Transparent status bar that blends into the terminal background
# (solid default green paints an ugly slab into Ghostty's rounded corners).
# Colors from the nvim vscode theme (lua/colors/init.lua)
set -g status-style "bg=default,fg=#808080"
# status-format with two aligned zones. align=left/right place each:
#   left   windows  — #{W:...} loops all windows; active one gets the blue
#                     highlight, others the quiet gray (same palette as before)
#   right  file path (nvim panes only), then session on git — nvim publishes the
#                     open file's cwd-relative path as the pane title, so we show
#                     it only when the pane runs nvim (in a shell it's just the
#                     cwd, redundant with the session name). Then cyan session
#                     name, white 'on', green branch and change counts from
#                     status-path.sh (mirrors the zsh prompt). No user@host
#                     here: the window title and the prompt's %n@%m already
#                     carry it
set -g status-format[0] "#[align=left]#{W:#[range=window|#{window_index}]#{?window_active,#[fg=#D4D4D4 bg=#03395e bold],#[fg=#5A5A5A]} #I:#W #[norange default]}#[align=right]#{?client_prefix,#[fg=#DCDCAA bold]^A ,}#{?#{==:#{pane_current_command},nvim},#[fg=#808080]#{pane_title} ,}#[fg=cyan]#{session_name}#(/bin/sh ~/.config/tmux/status-path.sh \"#{pane_current_path}\") #(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
set -g status-interval 5 # Refresh branch name every 5s

# Pane borders and copy-mode selection in the same palette
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#444444"
set -g mode-style "bg=#264F78"
set -g message-style "bg=default,fg=#DCDCAA"

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # 'v' to begin selection
bind-key -T copy-mode-vi 'y' send -X copy-selection # 'y' to copy

unbind -T copy-mode-vi MouseDragEnd1Pane # Don't exit copy mode with mouse drag

set -sg escape-time 10 # Remove esc delay in Neovim

# Forward terminal focus in/out to programs: nvim's FocusGained/FocusLost
# drive autoread and gitsigns refresh when you switch panes/apps.
set -g focus-events on
# Default 2000 lines of scrollback evaporates fast; 50k is still cheap.
set -g history-limit 50000
# Let image protocols (kitty graphics/sixel) tunnel through tmux to Ghostty.
set -g allow-passthrough on

# Ctrl+F opens the project sessionizer from any pane (even inside nvim);
# the zsh dev-widget only handles Ctrl+F outside tmux.
# -B: no tmux border — fzf fills the popup and draws the only border,
# in the FZF_DEFAULT_OPTS theme (DEV_POPUP tells dev() to skip --height)
# Lean shell (~7ms) instead of full interactive startup (~340ms): source only
# env.zsh (PATH, FZF theme) and functions.zsh (dev)
bind -n C-f display-popup -B -E -w 60% -h 50% "DEV_POPUP=1 zsh -c 'source ~/.config/zsh/env.zsh; source ~/.config/zsh/functions.zsh; dev'"

# Persist tmux sessions across restarts with tmux-resurrect and tmux-continuum.
# Manual save/restore: prefix + Ctrl-s / prefix + Ctrl-r.
# Continuum autosaves every 5 minutes and restores when the tmux server starts.
# NOTE: continuum triggers saves via a hook it injects into status-right, but
# the custom status-format above replaces the whole status line and never
# renders status-right — so the same continuum_save.sh is embedded directly in
# status-format (invisible; runs every status-interval, saves per the interval
# below). Without that embed, autosave silently never fires.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'
